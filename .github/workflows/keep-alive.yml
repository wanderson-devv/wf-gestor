name: Keep Render Alive

# Mantem o Render (free tier) acordado SEM depender do PC e SEM sofrer
# o throttle do cron do GitHub (schedule derruba a maioria dos runs */5).
#
# Estrategia: cada run pingeia /health a cada 6 min por ~5h24 e, ao final,
# despacha a proxima run via workflow_dispatch (API) usando o GITHUB_TOKEN.
# O workflow_dispatch e a UNICA excecao que o GitHub permite encadear
# recursivamente com o proprio token, entao a cadeia se sustenta sozinha.
#
# - schedule (*/5): semente/destravador caso a cadeia morra (gatilho
#   best-effort, dispara poucas vezes por dia - nao e a base).
# - push (main): resemente a cadeia a cada deploy.
# - concurrency cancel-in-progress: garante UMA unica cadeia ativa
#   (quem chega depois substitui a anterior, nunca duplica).

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

concurrency:
  group: keep-render-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Ping /health a cada 6 min
        run: |
          for i in $(seq 1 55); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 https://wf-gestor-api.onrender.com/health || true)
            echo "[$(date -u +%H:%M:%S)] ping $i/55 -> HTTP ${code:-000}"
            if [ "${code:-000}" != "200" ]; then
              echo "  nao-200: se o Render estava dormindo, este ping o acorda (proxima tentativa em 6 min)"
            fi
            [ "$i" -lt 55 ] && sleep 360
          done
      - name: Encadear proxima run
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/keep-alive.yml/dispatches" \
              -d '{"ref":"main"}' || true)
            echo "dispatch tentativa $i -> HTTP ${code:-000}"
            [ "${code:-000}" = "204" ] && exit 0
            sleep 15
          done
          echo "dispatch falhou - cadeia depende de semente (schedule/push)"
          exit 1
