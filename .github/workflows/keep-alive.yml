name: Keep Render Alive

# Mante o servico no Render (free tier) sempre acordado.
# O Render dorme apos ~15 min sem trafego. Um ping a cada 5 min chega
# bem antes desse limite e ainda absorve o atraso (jitter) best-effort
# do cron do GitHub (que pode atrasar alguns minutos).
# O scheduler precisa ser externo ao proprio servico (repo publico
# => GitHub Actions sem custo).

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          curl -fsS --max-time 60 https://wf-gestor-api.onrender.com/health \
            && echo " OK" \
            || { echo " ping falhou"; exit 1; }
